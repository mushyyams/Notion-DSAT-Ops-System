<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="980" viewBox="0 0 1440 980" role="img" aria-labelledby="title desc">
  <title id="title">Screenshot mockup of DSAT intake queue</title>
  <desc id="desc">Screenshot-style Notion intake database showing DSAT rows, status, root cause, user type, SLA due date, and SLA met fields.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
    <style>
      .browser { fill: #ffffff; }
      .chrome { fill: #f1f5f9; }
      .sidebar { fill: #fbfbfa; }
      .page-title { font: 800 42px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .h2 { font: 700 20px Inter, ui-sans-serif, system-ui, sans-serif; fill: #111827; }
      .body { font: 500 14px Inter, ui-sans-serif, system-ui, sans-serif; fill: #334155; }
      .small { font: 600 12px Inter, ui-sans-serif, system-ui, sans-serif; fill: #64748b; }
      .head { font: 700 12px Inter, ui-sans-serif, system-ui, sans-serif; fill: #64748b; letter-spacing: .05em; }
      .cell { font: 500 13px Inter, ui-sans-serif, system-ui, sans-serif; fill: #334155; }
      .table-line { stroke: #e5e7eb; stroke-width: 1; }
    </style>
  </defs>

  <rect width="1440" height="980" fill="#e2e8f0"/>
  <g filter="url(#shadow)">
    <rect x="70" y="60" width="1300" height="860" rx="28" class="browser"/>
    <rect x="70" y="60" width="1300" height="64" rx="28" class="chrome"/>
    <circle cx="108" cy="92" r="8" fill="#ef4444"/>
    <circle cx="136" cy="92" r="8" fill="#f59e0b"/>
    <circle cx="164" cy="92" r="8" fill="#22c55e"/>
    <rect x="230" y="78" width="530" height="28" rx="14" fill="#ffffff"/>
    <text x="252" y="97" class="small">notion.so/DSAT-Intake</text>

    <rect x="70" y="124" width="250" height="796" class="sidebar"/>
    <text x="105" y="175" class="small">DSAT Operations</text>
    <rect x="105" y="255" width="170" height="32" rx="8" fill="#dbeafe"/>
    <text x="124" y="231" class="body">Command Center</text>
    <text x="124" y="276" class="body">DSAT Intake</text>
    <text x="124" y="318" class="body">Taxonomy</text>
    <text x="124" y="358" class="body">Capacity + Forecast</text>

    <g transform="translate(370 170)">
      <text x="0" y="0" class="page-title">DSAT Intake</text>
      <text x="0" y="38" class="body">One row per DSAT. Operators filter by status, assign root cause, and monitor SLA due dates.</text>

      <rect x="0" y="78" width="130" height="36" rx="18" fill="#eff6ff" stroke="#bfdbfe"/>
      <text x="24" y="101" class="small">Status: Open</text>
      <rect x="148" y="78" width="170" height="36" rx="18" fill="#fff7ed" stroke="#fed7aa"/>
      <text x="172" y="101" class="small">Sort: SLA due date</text>
      <rect x="336" y="78" width="160" height="36" rx="18" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="360" y="101" class="small">Group: User Type</text>

      <rect x="0" y="150" width="940" height="560" rx="18" fill="#ffffff" stroke="#e5e7eb"/>
      <rect x="0" y="150" width="940" height="46" rx="18" fill="#f8fafc"/>

      <text x="22" y="180" class="head">DSAT ID</text>
      <text x="142" y="180" class="head">DATE RECEIVED</text>
      <text x="282" y="180" class="head">STATUS</text>
      <text x="418" y="180" class="head">ROOT CAUSE</text>
      <text x="628" y="180" class="head">USER TYPE</text>
      <text x="742" y="180" class="head">SLA DUE</text>
      <text x="842" y="180" class="head">SLA MET?</text>

      <line x1="0" y1="196" x2="940" y2="196" class="table-line"/>
      <line x1="0" y1="252" x2="940" y2="252" class="table-line"/>
      <line x1="0" y1="308" x2="940" y2="308" class="table-line"/>
      <line x1="0" y1="364" x2="940" y2="364" class="table-line"/>
      <line x1="0" y1="420" x2="940" y2="420" class="table-line"/>
      <line x1="0" y1="476" x2="940" y2="476" class="table-line"/>
      <line x1="0" y1="532" x2="940" y2="532" class="table-line"/>

      <text x="22" y="231" class="cell">DSAT-0018</text>
      <text x="142" y="231" class="cell">2026-03-10</text>
      <rect x="282" y="212" width="72" height="24" rx="12" fill="#dbeafe"/>
      <text x="302" y="229" class="cell">New</text>
      <text x="418" y="231" class="cell">-</text>
      <text x="628" y="231" class="cell">SMB</text>
      <text x="742" y="231" class="cell">2026-03-12</text>
      <text x="842" y="231" class="cell">-</text>

      <text x="22" y="287" class="cell">DSAT-0014</text>
      <text x="142" y="287" class="cell">2026-03-08</text>
      <rect x="282" y="268" width="102" height="24" rx="12" fill="#fef9c3"/>
      <text x="300" y="285" class="cell">In Progress</text>
      <text x="418" y="287" class="cell">-</text>
      <text x="628" y="287" class="cell">Enterprise</text>
      <text x="742" y="287" class="cell">2026-03-10</text>
      <text x="842" y="287" class="cell">-</text>

      <text x="22" y="343" class="cell">DSAT-0015</text>
      <text x="142" y="343" class="cell">2026-03-09</text>
      <rect x="282" y="324" width="112" height="24" rx="12" fill="#dcfce7"/>
      <text x="302" y="341" class="cell">Categorized</text>
      <text x="418" y="343" class="cell">Escalation / handoff</text>
      <text x="628" y="343" class="cell">Enterprise</text>
      <text x="742" y="343" class="cell">2026-03-11</text>
      <text x="842" y="343" class="cell">Yes</text>

      <text x="22" y="399" class="cell">DSAT-0013</text>
      <text x="142" y="399" class="cell">2026-03-08</text>
      <rect x="282" y="380" width="112" height="24" rx="12" fill="#dcfce7"/>
      <text x="302" y="397" class="cell">Categorized</text>
      <text x="418" y="399" class="cell">Pricing / billing</text>
      <text x="628" y="399" class="cell">SMB</text>
      <text x="742" y="399" class="cell">2026-03-10</text>
      <text x="842" y="399" class="cell">Yes</text>

      <text x="22" y="455" class="cell">DSAT-0008</text>
      <text x="142" y="455" class="cell">2026-03-01</text>
      <rect x="282" y="436" width="112" height="24" rx="12" fill="#dcfce7"/>
      <text x="302" y="453" class="cell">Categorized</text>
      <text x="418" y="455" class="cell">Expectation mismatch</text>
      <text x="628" y="455" class="cell">Free tier</text>
      <text x="742" y="455" class="cell">2026-03-03</text>
      <text x="842" y="455" class="cell" fill="#b45309">No</text>

      <rect x="22" y="620" width="880" height="58" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="44" y="655" class="body">Usage moment: ops filters uncategorized rows, selects a taxonomy category, adds notes, and marks the DSAT Categorized once complete.</text>
    </g>
  </g>
</svg>
