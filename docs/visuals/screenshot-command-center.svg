<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="980" viewBox="0 0 1440 980" role="img" aria-labelledby="title desc">
  <title id="title">Screenshot mockup of DSAT command center</title>
  <desc id="desc">Screenshot-style Notion command center showing key dates, quick links, and daily operating checklist.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
    <style>
      .browser { fill: #ffffff; }
      .chrome { fill: #f1f5f9; }
      .sidebar { fill: #fbfbfa; }
      .page-title { font: 800 42px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .h2 { font: 700 22px Inter, ui-sans-serif, system-ui, sans-serif; fill: #111827; }
      .body { font: 500 15px Inter, ui-sans-serif, system-ui, sans-serif; fill: #334155; }
      .small { font: 600 13px Inter, ui-sans-serif, system-ui, sans-serif; fill: #64748b; }
      .tiny { font: 700 11px Inter, ui-sans-serif, system-ui, sans-serif; fill: #64748b; letter-spacing: .08em; }
      .metric { font: 800 28px Inter, ui-sans-serif, system-ui, sans-serif; fill: #111827; }
      .card { fill: #ffffff; stroke: #e5e7eb; stroke-width: 1.5; }
      .muted { fill: #f8fafc; stroke: #e2e8f0; stroke-width: 1.5; }
    </style>
  </defs>

  <rect width="1440" height="980" fill="#e2e8f0"/>
  <g filter="url(#shadow)">
    <rect x="70" y="60" width="1300" height="860" rx="28" class="browser"/>
    <rect x="70" y="60" width="1300" height="64" rx="28" class="chrome"/>
    <circle cx="108" cy="92" r="8" fill="#ef4444"/>
    <circle cx="136" cy="92" r="8" fill="#f59e0b"/>
    <circle cx="164" cy="92" r="8" fill="#22c55e"/>
    <rect x="230" y="78" width="530" height="28" rx="14" fill="#ffffff"/>
    <text x="252" y="97" class="small">notion.so/DSAT-Operations-Command-Center</text>

    <rect x="70" y="124" width="250" height="796" class="sidebar"/>
    <text x="105" y="175" class="small">Workspace</text>
    <rect x="105" y="210" width="170" height="32" rx="8" fill="#ede9fe"/>
    <text x="124" y="231" class="body">DSAT Operations</text>
    <text x="124" y="278" class="body">DSAT Intake</text>
    <text x="124" y="318" class="body">DSAT Taxonomy</text>
    <text x="124" y="358" class="body">Execution Plan</text>
    <text x="124" y="398" class="body">Capacity + Forecast</text>
    <text x="124" y="438" class="body">DSAT Insights</text>

    <g transform="translate(370 170)">
      <text x="0" y="0" class="page-title">DSAT Operations Command Center</text>
      <text x="0" y="38" class="body">Daily home base for DSAT categorization, backlog progress, and SLA monitoring.</text>

      <rect x="0" y="80" width="220" height="118" rx="18" fill="#eff6ff" stroke="#bfdbfe"/>
      <text x="24" y="116" class="tiny">SETUP COMPLETE</text>
      <text x="24" y="154" class="metric">Mar 9</text>
      <text x="24" y="178" class="small">Categorization begins</text>

      <rect x="250" y="80" width="220" height="118" rx="18" fill="#f0fdf4" stroke="#bbf7d0"/>
      <text x="274" y="116" class="tiny">BACKLOG ZERO</text>
      <text x="274" y="154" class="metric">Mar 23</text>
      <text x="274" y="178" class="small">All DSATs categorized</text>

      <rect x="500" y="80" width="220" height="118" rx="18" fill="#fff7ed" stroke="#fed7aa"/>
      <text x="524" y="116" class="tiny">BACKLOG AT START</text>
      <text x="524" y="154" class="metric">597</text>
      <text x="524" y="178" class="small">After setup arrivals</text>

      <rect x="750" y="80" width="180" height="118" rx="18" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="774" y="116" class="tiny">CAPACITY</text>
      <text x="774" y="154" class="metric">72/day</text>
      <text x="774" y="178" class="small">Weekdays only</text>

      <rect x="0" y="245" width="450" height="250" rx="18" class="card"/>
      <text x="28" y="286" class="h2">Daily operating checklist</text>
      <rect x="28" y="318" width="18" height="18" rx="4" fill="#dcfce7" stroke="#22c55e"/>
      <text x="62" y="333" class="body">Review New and In Progress DSATs</text>
      <rect x="28" y="362" width="18" height="18" rx="4" fill="#dcfce7" stroke="#22c55e"/>
      <text x="62" y="377" class="body">Prioritize rows approaching SLA due date</text>
      <rect x="28" y="406" width="18" height="18" rx="4" fill="#ffffff" stroke="#94a3b8"/>
      <text x="62" y="421" class="body">Assign root cause from taxonomy</text>
      <rect x="28" y="450" width="18" height="18" rx="4" fill="#ffffff" stroke="#94a3b8"/>
      <text x="62" y="465" class="body">Mark completed rows as Categorized</text>

      <rect x="490" y="245" width="440" height="250" rx="18" class="card"/>
      <text x="518" y="286" class="h2">Quick links</text>
      <rect x="518" y="318" width="360" height="40" rx="12" class="muted"/>
      <text x="538" y="344" class="body">Open DSAT Intake queue</text>
      <rect x="518" y="374" width="360" height="40" rx="12" class="muted"/>
      <text x="538" y="400" class="body">Review Forecast Schedule</text>
      <rect x="518" y="430" width="360" height="40" rx="12" class="muted"/>
      <text x="538" y="456" class="body">Open DSAT Insights dashboard</text>

      <rect x="0" y="535" width="930" height="140" rx="18" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="28" y="576" class="h2">How it is used</text>
      <text x="28" y="614" class="body">Ops starts here each morning, checks the forecast status, jumps into the intake queue, categorizes DSATs, and uses insights for weekly taxonomy and SLA review.</text>
    </g>
  </g>
</svg>
