<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">Operator usage flow wireframe</title>
  <desc id="desc">Low-fidelity wireframe showing how a CX operations user moves from daily triage to categorization, SLA review, and weekly insights.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <style>
      .title { font: 700 34px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .subtitle { font: 500 16px Inter, ui-sans-serif, system-ui, sans-serif; fill: #64748b; }
      .step { font: 800 16px Inter, ui-sans-serif, system-ui, sans-serif; fill: #ffffff; }
      .card-title { font: 700 20px Inter, ui-sans-serif, system-ui, sans-serif; fill: #111827; }
      .label { font: 600 14px Inter, ui-sans-serif, system-ui, sans-serif; fill: #475569; }
      .tiny { font: 700 11px Inter, ui-sans-serif, system-ui, sans-serif; fill: #64748b; letter-spacing: .08em; }
      .line { stroke: #64748b; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .wire { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 2; }
      .bar { fill: #e2e8f0; }
    </style>
  </defs>

  <rect width="1200" height="820" rx="32" fill="#f8fafc"/>
  <text x="60" y="72" class="title">Operator Usage Flow Wireframe</text>
  <text x="60" y="104" class="subtitle">A low-fidelity view of how the system is used during daily triage, categorization, SLA follow-up, and weekly review.</text>

  <g filter="url(#shadow)">
    <rect x="70" y="165" width="245" height="245" rx="26" fill="#ffffff"/>
    <circle cx="116" cy="211" r="22" fill="#2563eb"/>
    <text x="110" y="217" class="step">1</text>
    <text x="150" y="205" class="tiny">DAILY START</text>
    <text x="100" y="255" class="card-title">Open command center</text>
    <rect x="100" y="292" width="184" height="22" rx="11" class="bar"/>
    <rect x="100" y="327" width="152" height="22" rx="11" class="bar"/>
    <rect x="100" y="362" width="198" height="22" rx="11" class="bar"/>
  </g>

  <path class="line" d="M 325 288 C 365 288 380 288 420 288"/>

  <g filter="url(#shadow)">
    <rect x="430" y="165" width="245" height="245" rx="26" fill="#ffffff"/>
    <circle cx="476" cy="211" r="22" fill="#2563eb"/>
    <text x="470" y="217" class="step">2</text>
    <text x="510" y="205" class="tiny">TRIAGE</text>
    <text x="460" y="255" class="card-title">Filter new DSATs</text>
    <rect x="460" y="290" width="180" height="36" rx="12" class="wire"/>
    <rect x="460" y="342" width="180" height="36" rx="12" class="wire"/>
    <rect x="460" y="394" width="120" height="16" rx="8" class="bar"/>
  </g>

  <path class="line" d="M 685 288 C 725 288 740 288 780 288"/>

  <g filter="url(#shadow)">
    <rect x="790" y="165" width="245" height="245" rx="26" fill="#ffffff"/>
    <circle cx="836" cy="211" r="22" fill="#2563eb"/>
    <text x="830" y="217" class="step">3</text>
    <text x="870" y="205" class="tiny">CATEGORIZE</text>
    <text x="820" y="255" class="card-title">Assign root cause</text>
    <rect x="820" y="292" width="184" height="22" rx="11" class="bar"/>
    <rect x="820" y="327" width="152" height="22" rx="11" class="bar"/>
    <rect x="820" y="362" width="198" height="42" rx="14" class="wire"/>
  </g>

  <path class="line" d="M 912 420 C 912 458 912 470 912 506"/>

  <g filter="url(#shadow)">
    <rect x="790" y="520" width="245" height="225" rx="26" fill="#ffffff"/>
    <circle cx="836" cy="566" r="22" fill="#16a34a"/>
    <text x="830" y="572" class="step">4</text>
    <text x="870" y="560" class="tiny">SLA REVIEW</text>
    <text x="820" y="610" class="card-title">Check at-risk work</text>
    <rect x="820" y="644" width="184" height="22" rx="11" class="bar"/>
    <rect x="820" y="679" width="108" height="22" rx="11" class="bar"/>
    <rect x="944" y="679" width="60" height="22" rx="11" fill="#fed7aa"/>
  </g>

  <path class="line" d="M 780 632 C 725 632 730 632 675 632"/>

  <g filter="url(#shadow)">
    <rect x="430" y="520" width="245" height="225" rx="26" fill="#ffffff"/>
    <circle cx="476" cy="566" r="22" fill="#16a34a"/>
    <text x="470" y="572" class="step">5</text>
    <text x="510" y="560" class="tiny">STATUS UPDATE</text>
    <text x="460" y="610" class="card-title">Mark complete</text>
    <rect x="460" y="646" width="185" height="38" rx="14" class="wire"/>
    <rect x="460" y="700" width="150" height="22" rx="11" class="bar"/>
  </g>

  <path class="line" d="M 420 632 C 365 632 370 632 315 632"/>

  <g filter="url(#shadow)">
    <rect x="70" y="520" width="245" height="225" rx="26" fill="#ffffff"/>
    <circle cx="116" cy="566" r="22" fill="#8b5cf6"/>
    <text x="110" y="572" class="step">6</text>
    <text x="150" y="560" class="tiny">WEEKLY REVIEW</text>
    <text x="100" y="610" class="card-title">Share insights</text>
    <rect x="100" y="646" width="184" height="22" rx="11" class="bar"/>
    <rect x="100" y="681" width="152" height="22" rx="11" class="bar"/>
    <rect x="100" y="716" width="198" height="22" rx="11" class="bar"/>
  </g>

  <g>
    <rect x="90" y="454" width="1010" height="1" fill="#e2e8f0"/>
    <text x="90" y="478" class="label">Daily loop: command center -> intake filters -> categorization -> SLA review -> completion updates</text>
    <text x="90" y="785" class="label">Weekly loop: review taxonomy distribution, SLA misses, capacity assumptions, and process improvements.</text>
  </g>
</svg>
