<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">Dashboard layout wireframe</title>
  <desc id="desc">Low-fidelity wireframe for a Notion DSAT dashboard with hero metrics, forecast panel, intake queue, taxonomy distribution, and SLA risk queue.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <style>
      .title { font: 700 34px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .subtitle { font: 500 16px Inter, ui-sans-serif, system-ui, sans-serif; fill: #64748b; }
      .label { font: 700 14px Inter, ui-sans-serif, system-ui, sans-serif; fill: #334155; }
      .small { font: 600 12px Inter, ui-sans-serif, system-ui, sans-serif; fill: #64748b; }
      .wire { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 2; }
      .panel { fill: #ffffff; stroke: #e2e8f0; stroke-width: 2; }
      .bar { fill: #e2e8f0; }
      .accent { fill: #dbeafe; stroke: #bfdbfe; stroke-width: 2; }
    </style>
  </defs>

  <rect width="1200" height="820" rx="32" fill="#f8fafc"/>
  <text x="60" y="72" class="title">Dashboard Layout Wireframe</text>
  <text x="60" y="104" class="subtitle">A proposed Notion home page structure for daily DSAT operations and leadership review.</text>

  <g filter="url(#shadow)">
    <rect x="70" y="145" width="1060" height="610" rx="30" fill="#ffffff"/>
    <rect x="70" y="145" width="1060" height="78" rx="30" fill="#f1f5f9"/>
    <rect x="110" y="175" width="300" height="22" rx="11" class="bar"/>
    <rect x="910" y="168" width="170" height="36" rx="18" class="accent"/>
    <text x="945" y="191" class="small">SLA sustainable</text>
  </g>

  <g>
    <rect x="110" y="260" width="230" height="94" rx="20" class="panel"/>
    <text x="135" y="292" class="small">SETUP COMPLETE</text>
    <rect x="135" y="312" width="118" height="28" rx="14" class="bar"/>

    <rect x="370" y="260" width="230" height="94" rx="20" class="panel"/>
    <text x="395" y="292" class="small">BACKLOG ZERO</text>
    <rect x="395" y="312" width="118" height="28" rx="14" class="bar"/>

    <rect x="630" y="260" width="230" height="94" rx="20" class="panel"/>
    <text x="655" y="292" class="small">OPEN DSATS</text>
    <rect x="655" y="312" width="118" height="28" rx="14" class="bar"/>

    <rect x="890" y="260" width="200" height="94" rx="20" class="panel"/>
    <text x="915" y="292" class="small">AT RISK</text>
    <rect x="915" y="312" width="98" height="28" rx="14" class="bar"/>
  </g>

  <g>
    <rect x="110" y="390" width="500" height="270" rx="22" class="panel"/>
    <text x="135" y="426" class="label">DSAT Intake Queue</text>
    <line x1="135" y1="456" x2="585" y2="456" stroke="#e2e8f0" stroke-width="2"/>
    <rect x="135" y="480" width="94" height="18" rx="9" class="bar"/>
    <rect x="260" y="480" width="80" height="18" rx="9" class="bar"/>
    <rect x="378" y="480" width="120" height="18" rx="9" class="bar"/>
    <rect x="520" y="480" width="46" height="18" rx="9" class="bar"/>
    <line x1="135" y1="520" x2="585" y2="520" stroke="#e2e8f0" stroke-width="2"/>
    <line x1="135" y1="565" x2="585" y2="565" stroke="#e2e8f0" stroke-width="2"/>
    <line x1="135" y1="610" x2="585" y2="610" stroke="#e2e8f0" stroke-width="2"/>
  </g>

  <g>
    <rect x="650" y="390" width="440" height="270" rx="22" class="panel"/>
    <text x="675" y="426" class="label">Forecast + Insights</text>
    <rect x="675" y="462" width="370" height="74" rx="18" class="wire"/>
    <rect x="695" y="486" width="170" height="18" rx="9" class="bar"/>
    <rect x="880" y="486" width="130" height="18" rx="9" class="bar"/>
    <rect x="675" y="562" width="105" height="70" rx="16" class="wire"/>
    <rect x="802" y="540" width="105" height="92" rx="16" class="wire"/>
    <rect x="929" y="582" width="105" height="50" rx="16" class="wire"/>
  </g>

  <g>
    <rect x="110" y="695" width="980" height="24" rx="12" class="bar"/>
    <text x="110" y="785" class="small">Wireframe sections map to the real Notion pages created by setup, seed, forecast table, and insights scripts.</text>
  </g>
</svg>
