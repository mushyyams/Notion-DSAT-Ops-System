<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">DSAT Operations system workflow</title>
  <desc id="desc">End-to-end workflow showing inputs, forecast logic, Notion setup scripts, databases, and operating outputs.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fbff"/>
      <stop offset="100%" stop-color="#eef4ff"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <style>
      .title { font: 700 34px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .subtitle { font: 500 16px Inter, ui-sans-serif, system-ui, sans-serif; fill: #475569; }
      .label { font: 700 18px Inter, ui-sans-serif, system-ui, sans-serif; fill: #0f172a; }
      .small { font: 500 13px Inter, ui-sans-serif, system-ui, sans-serif; fill: #475569; }
      .tiny { font: 600 12px Inter, ui-sans-serif, system-ui, sans-serif; fill: #64748b; letter-spacing: .04em; }
      .white { fill: #ffffff; }
      .muted { fill: #64748b; }
      .line { stroke: #64748b; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .soft-line { stroke: #cbd5e1; stroke-width: 2; fill: none; stroke-dasharray: 7 7; }
    </style>
  </defs>

  <rect width="1200" height="760" rx="32" fill="url(#bg)"/>
  <circle cx="1040" cy="90" r="150" fill="#dbeafe" opacity="0.65"/>
  <circle cx="120" cy="680" r="180" fill="#dcfce7" opacity="0.55"/>

  <text x="60" y="72" class="title">DSAT Operations System</text>
  <text x="60" y="104" class="subtitle">A Notion-backed workflow that turns DSAT intake into categorized issues, forecast dates, SLA monitoring, and leadership-ready insights.</text>

  <g filter="url(#shadow)">
    <rect x="60" y="160" width="250" height="180" rx="24" fill="#ffffff"/>
    <rect x="60" y="160" width="250" height="54" rx="24" fill="#dbeafe"/>
    <text x="88" y="194" class="tiny">INPUTS</text>
    <text x="88" y="246" class="label">Assignment scenario</text>
    <text x="88" y="276" class="small">471 starting backlog</text>
    <text x="88" y="302" class="small">18/day, then 12/day arrivals</text>
    <text x="88" y="328" class="small">72/day weekday capacity</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="60" y="420" width="250" height="180" rx="24" fill="#ffffff"/>
    <rect x="60" y="420" width="250" height="54" rx="24" fill="#ede9fe"/>
    <text x="88" y="454" class="tiny">SETUP RULES</text>
    <text x="88" y="506" class="label">5 business days</text>
    <text x="88" y="536" class="small">Taxonomy build</text>
    <text x="88" y="562" class="small">Intake database build</text>
    <text x="88" y="588" class="small">Manager review</text>
  </g>

  <path class="line" d="M 320 250 C 390 250 400 250 455 250"/>
  <path class="line" d="M 320 510 C 390 510 400 510 455 510"/>

  <g filter="url(#shadow)">
    <rect x="455" y="205" width="290" height="350" rx="28" fill="#ffffff"/>
    <rect x="485" y="235" width="230" height="76" rx="20" fill="url(#blue)"/>
    <text x="515" y="266" class="white" style="font: 700 20px Inter, ui-sans-serif, system-ui, sans-serif;">Forecast engine</text>
    <text x="515" y="292" class="white" style="font: 500 13px Inter, ui-sans-serif, system-ui, sans-serif;">scripts/forecast.js</text>

    <rect x="493" y="342" width="214" height="50" rx="16" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="520" y="373" class="small">Business-day calendar</text>
    <rect x="493" y="410" width="214" height="50" rx="16" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="520" y="441" class="small">Daily burn-down loop</text>
    <rect x="493" y="478" width="214" height="50" rx="16" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="520" y="509" class="small">Auditable schedule rows</text>
  </g>

  <path class="line" d="M 748 380 C 805 380 815 380 870 380"/>

  <g filter="url(#shadow)">
    <rect x="870" y="160" width="270" height="440" rx="28" fill="#ffffff"/>
    <rect x="900" y="190" width="210" height="64" rx="18" fill="url(#green)"/>
    <text x="928" y="229" class="white" style="font: 700 20px Inter, ui-sans-serif, system-ui, sans-serif;">Notion workspace</text>

    <rect x="900" y="286" width="210" height="48" rx="14" fill="#ecfdf5" stroke="#a7f3d0"/>
    <text x="924" y="316" class="small">DSAT Taxonomy</text>
    <rect x="900" y="354" width="210" height="48" rx="14" fill="#ecfdf5" stroke="#a7f3d0"/>
    <text x="924" y="384" class="small">DSAT Intake</text>
    <rect x="900" y="422" width="210" height="48" rx="14" fill="#ecfdf5" stroke="#a7f3d0"/>
    <text x="924" y="452" class="small">Execution Plan</text>
    <rect x="900" y="490" width="210" height="48" rx="14" fill="#ecfdf5" stroke="#a7f3d0"/>
    <text x="924" y="520" class="small">Capacity + Forecast</text>
  </g>

  <path class="line" d="M 1005 604 C 1005 655 770 662 710 618"/>
  <path class="soft-line" d="M 600 555 C 600 600 610 632 660 654"/>

  <g filter="url(#shadow)">
    <rect x="410" y="620" width="380" height="88" rx="24" fill="#ffffff"/>
    <rect x="436" y="643" width="88" height="42" rx="14" fill="url(#purple)"/>
    <text x="463" y="669" class="white" style="font: 700 14px Inter, ui-sans-serif, system-ui, sans-serif;">OUTPUT</text>
    <text x="548" y="652" class="label">Portfolio story</text>
    <text x="548" y="682" class="small">Operational system with automation, data model, forecast, and measurable SLA outcomes.</text>
  </g>
</svg>
