<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc">
  <title id="title">Notion data model for DSAT operations</title>
  <desc id="desc">Data model diagram showing DSAT Intake, DSAT Taxonomy, Execution Plan, Capacity Forecast, and Insights relationships.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff7ed"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="9" stdDeviation="9" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <style>
      .title { font: 700 34px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .subtitle { font: 500 16px Inter, ui-sans-serif, system-ui, sans-serif; fill: #64748b; }
      .db-title { font: 700 21px Inter, ui-sans-serif, system-ui, sans-serif; fill: #111827; }
      .section { font: 700 12px Inter, ui-sans-serif, system-ui, sans-serif; fill: #64748b; letter-spacing: .08em; }
      .field { font: 500 14px Inter, ui-sans-serif, system-ui, sans-serif; fill: #334155; }
      .chip { font: 700 12px Inter, ui-sans-serif, system-ui, sans-serif; fill: #ffffff; }
      .note { font: 600 13px Inter, ui-sans-serif, system-ui, sans-serif; fill: #475569; }
      .relation { stroke: #475569; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .rollup { stroke: #ea580c; stroke-width: 3; fill: none; stroke-dasharray: 7 7; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1200" height="780" rx="32" fill="url(#bg)"/>
  <text x="60" y="72" class="title">Notion Data Model</text>
  <text x="60" y="104" class="subtitle">The system uses linked Notion databases for intake tracking, taxonomy consistency, project setup, and forecast visibility.</text>

  <g filter="url(#shadow)">
    <rect x="64" y="165" width="360" height="430" rx="24" fill="#ffffff"/>
    <rect x="64" y="165" width="360" height="74" rx="24" fill="#dbeafe"/>
    <text x="94" y="210" class="db-title">DSAT Intake</text>
    <rect x="292" y="186" width="98" height="30" rx="15" fill="#2563eb"/>
    <text x="314" y="206" class="chip">DATABASE</text>
    <text x="94" y="278" class="section">CORE FIELDS</text>
    <text x="94" y="314" class="field">DSAT ID (title)</text>
    <text x="94" y="342" class="field">Date received</text>
    <text x="94" y="370" class="field">Status: New, In Progress, Categorized</text>
    <text x="94" y="398" class="field">User Type</text>
    <text x="94" y="426" class="field">Date categorized</text>
    <text x="94" y="470" class="section">AUTOMATION</text>
    <text x="94" y="506" class="field">SLA due date formula</text>
    <text x="94" y="534" class="field">SLA met? formula</text>
    <text x="94" y="562" class="field">Root cause relation</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="778" y="170" width="360" height="300" rx="24" fill="#ffffff"/>
    <rect x="778" y="170" width="360" height="74" rx="24" fill="#dcfce7"/>
    <text x="808" y="215" class="db-title">DSAT Taxonomy</text>
    <rect x="1006" y="191" width="98" height="30" rx="15" fill="#16a34a"/>
    <text x="1028" y="211" class="chip">DATABASE</text>
    <text x="808" y="282" class="section">ROOT-CAUSE LIBRARY</text>
    <text x="808" y="318" class="field">Category (title)</text>
    <text x="808" y="346" class="field">Definition</text>
    <text x="808" y="390" class="section">EXAMPLES</text>
    <text x="808" y="426" class="field">Product / technical issue</text>
    <text x="808" y="454" class="field">Wait time / speed</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="778" y="530" width="360" height="170" rx="24" fill="#ffffff"/>
    <rect x="778" y="530" width="360" height="62" rx="24" fill="#ffedd5"/>
    <text x="808" y="569" class="db-title">DSAT Insights</text>
    <text x="808" y="626" class="field">Linked views for taxonomy mix, SLA performance,</text>
    <text x="808" y="654" class="field">status snapshot, user type mix, and at-risk work.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="478" y="105" width="248" height="210" rx="24" fill="#ffffff"/>
    <rect x="478" y="105" width="248" height="62" rx="24" fill="#ede9fe"/>
    <text x="508" y="145" class="db-title">Execution Plan</text>
    <text x="508" y="201" class="field">Setup tasks</text>
    <text x="508" y="229" class="field">Dependencies</text>
    <text x="508" y="257" class="field">Forecast milestones</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="478" y="395" width="248" height="250" rx="24" fill="#ffffff"/>
    <rect x="478" y="395" width="248" height="62" rx="24" fill="#fef9c3"/>
    <text x="508" y="435" class="db-title">Capacity + Forecast</text>
    <text x="508" y="491" class="field">Setup complete date</text>
    <text x="508" y="519" class="field">Backlog zero date</text>
    <text x="508" y="547" class="field">SLA sustainable date</text>
    <text x="508" y="575" class="field">Forecast schedule table</text>
  </g>

  <path class="relation" d="M 424 562 C 548 562 644 342 778 342"/>
  <text x="506" y="355" class="note">Intake.Root cause</text>
  <text x="506" y="376" class="note">links each DSAT to one taxonomy category</text>

  <path class="rollup" d="M 958 470 C 958 510 958 510 958 530"/>
  <text x="984" y="508" class="note" fill="#ea580c">Rollups power category counts</text>

  <path class="relation" d="M 424 335 C 465 290 476 254 478 230"/>
  <path class="relation" d="M 424 492 C 446 518 458 522 478 522"/>
  <path class="relation" d="M 726 522 C 748 570 758 610 778 620"/>

  <g>
    <rect x="64" y="640" width="630" height="76" rx="22" fill="#ffffff" opacity="0.88"/>
    <text x="94" y="673" class="section">WHY THIS MATTERS</text>
    <text x="94" y="702" class="field">Portfolio viewers can see that this is more than a script: it is a connected operations data model with formulas, relations, and decision views.</text>
  </g>
</svg>
